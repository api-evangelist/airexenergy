aid: airexenergy
name: Airex Energy
description: >-
  Airex Energy (Airex Énergie) is a Laval, Québec cleantech company that converts residual
  biomass — forest residues, sawdust, bark and recycled wood — into biocoal, biochar and
  biocarbon using its patented CarbonFX torrefaction technology. Founded in 2014 as a division
  of Airex Industries, it operates a commercial biocoal pellet plant in Bécancour, Québec, has
  partnered with SUEZ to industrialize biochar production in Europe and North America, and
  raised a CAD $38 million Series B in 2024. It is an industrial manufacturer and does not
  publish a developer program or public API.
